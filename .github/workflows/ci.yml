name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-e-testes:
    name: Build e testes
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restaurar dependências
        run: dotnet restore Elcop.TI.slnx --locked-mode

      - name: Restaurar ferramentas locais (dotnet-ef)
        run: dotnet tool restore

      - name: Build (sem warnings tolerados)
        run: dotnet build Elcop.TI.slnx --no-restore --configuration Release /warnaserror

      - name: Verificar migrations em dia (AppDbContext)
        run: >
          dotnet ef migrations has-pending-model-changes
          --project src/Elcop.TI.Infrastructure --startup-project src/Elcop.TI.Web
          --context AppDbContext --no-build --configuration Release

      - name: Verificar migrations em dia (AppDbContextPostgres)
        run: >
          dotnet ef migrations has-pending-model-changes
          --project src/Elcop.TI.Infrastructure --startup-project src/Elcop.TI.Web
          --context AppDbContextPostgres --no-build --configuration Release

      - name: Testes (com cobertura)
        run: >
          dotnet test Elcop.TI.slnx --no-build --configuration Release
          --logger "trx" --results-directory ./resultados-testes
          --collect:"XPlat Code Coverage"
          --settings coverlet.runsettings

      - name: Validar limiar mínimo de cobertura
        shell: pwsh
        # Baseline atual da suíte: 38,93% de linhas e 21,51% de ramos.
        # Elevar estes limites junto com a inclusão de novos testes.
        run: ./scripts/validar-cobertura.ps1 -DiretorioResultados ./resultados-testes -MinimoLinha 38 -MinimoRamo 21

      - name: Auditoria de dependências vulneráveis
        run: >
          dotnet package list --project Elcop.TI.slnx --vulnerable --include-transitive
          --format json --output-version 1 > vulnerabilidades-dependencias.json

      - name: Bloquear vulnerabilidades altas ou críticas
        shell: pwsh
        run: ./scripts/validar-vulnerabilidades.ps1 -Relatorio ./vulnerabilidades-dependencias.json

      - name: Publicar resultados dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-testes
          path: resultados-testes

      - name: Publicar cobertura de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-testes
          path: resultados-testes/**/coverage.cobertura.xml

      - name: Publicar auditoria de dependências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulnerabilidades-dependencias
          path: vulnerabilidades-dependencias.json
